name: Code-Check

on:
  workflow_dispatch:
    inputs:
      shops:
        description: "Nur bestimmte Shops (kommagetrennt, leer = alle)"
        required: false
        default: ""
      debug:
        description: "Diagnose-Text speichern (1 = ja)"
        required: false
        default: ""
  schedule:
    - cron: "17 5 * * *"   # täglich ca. 6:17 / 7:17 Uhr deutscher Zeit

permissions:
  contents: write

concurrency:
  group: codecheck
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Playwright installieren
        run: |
          npm init -y >/dev/null
          npm install playwright@1 --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Codes an der Kasse prüfen
        env:
          SHOPS: ${{ github.event.inputs.shops }}
          DEBUG: ${{ github.event.inputs.debug }}
          TRIGGER: ${{ github.event_name == 'schedule' && 'täglich' || 'Button' }}
        run: node scripts/codecheck.mjs

      - name: Ergebnis speichern
        run: |
          git config user.name "SportSupp Code-Check"
          git config user.email "actions@users.noreply.github.com"
          git add codecheck.json
          git commit -m "Code-Check $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
